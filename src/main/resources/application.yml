spring:
  application:
    name: ykd
  config:
    import: optional:file:./config/application-local.yml
  ai:
    # API 网络抖动自动重试（默认 Spring AI 会重试 10 次，这里收敛为 3 次并带退避）
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
    chat:
      client:
        enabled: false
    openai:
      api-key: changeme
      base-url: https://apihub.agnes-ai.com/v1
      connect-timeout: 30s
      read-timeout: 120s
      chat:
        options:
          model: agnes-2.0-flash
      embedding:
        enabled: true
        api-key: changeme
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        options:
          model: text-embedding-v3
    deepseek:
      api-key: changeme
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
    elevenlabs:
      api-key: changeme
      base-url: https://api.elevenlabs.io
      tts:
        voice-id: EXAVITQu4vr4xnSDxMaL
        male-voice-id: pNInz6obpgDQGcFmaJgB
        model: eleven_turbo_v2_5
  datasource:
    # 工作目录根可被 YKD_WORK_DIR 环境变量覆盖，避免换目录启动时创建空库
    url: jdbc:sqlite:${YKD_WORK_DIR:./work}/sqlite/conversation.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  lifecycle:
    timeout-per-shutdown-phase: 20s

  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite/schema.sql
gaode:
  key: changeme
web-search:
  enabled: ${WEB_SEARCH_ENABLED:false}
  api-key: ${VOLCENGINE_SEARCH_API_KEY:}
  endpoint: ${VOLCENGINE_SEARCH_ENDPOINT:}
  max-results: ${WEB_SEARCH_MAX_RESULTS:5}
  timeout-seconds: ${WEB_SEARCH_TIMEOUT_SECONDS:15}
liepin:
  enabled: ${LIEPIN_ENABLED:false}
  headless: ${LIEPIN_HEADLESS:false}
  base-url: https://www.liepin.com
  profile-directory: ./work/liepin/browser-profile
  resume-directory: ./work/liepin/resumes
  browser-executable-path: ${LIEPIN_BROWSER_EXECUTABLE:}
  navigation-timeout-seconds: 45
  max-search-results: 10
  max-search-pages: 3
  default-salary-code: ""
  default-greeting: 请先在猎聘 App 中设置默认招呼语；程序确认岗位后点击“聊一聊”，猎聘会自动发送招呼语完成投递。
  auto-apply:
    enabled: ${LIEPIN_AUTO_APPLY_ENABLED:false}
    scan-interval-ms: ${LIEPIN_AUTO_SCAN_INTERVAL_MS:60000}
    default-daily-limit: ${LIEPIN_AUTO_DAILY_LIMIT:3}
    max-daily-limit: ${LIEPIN_AUTO_MAX_DAILY_LIMIT:20}
    default-min-match-score: ${LIEPIN_AUTO_MIN_MATCH_SCORE:85}
    default-interval-minutes: ${LIEPIN_AUTO_INTERVAL_MINUTES:30}
    max-consecutive-failures: ${LIEPIN_AUTO_MAX_FAILURES:3}
mybatis:
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
rag:
  enabled: true
  chunk-size: 300
  min-chunk-size-chars: 50
  max-num-chunks: 100
  top-k: 5
  max-context-chars: 6000
  similarity-threshold: 0.3