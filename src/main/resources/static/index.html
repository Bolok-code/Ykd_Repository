<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKD Bot 管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 60px;
            background: #0a0a0f;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(72, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 210, 255, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 0, 128, 0.08) 0%, transparent 50%);
            color: #e0e0e0;
        }

        .card {
            background: rgba(18, 18, 28, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 32px;
            width: 440px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        h1 {
            font-size: 22px;
            text-align: center;
            margin-bottom: 28px;
            font-weight: 600;
            background: linear-gradient(135deg, #00d2ff, #7b61ff, #ff0080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .status {
            text-align: center;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-ok {
            background: rgba(0, 255, 136, 0.08);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.05);
        }

        .status-off {
            background: rgba(255, 60, 60, 0.08);
            color: #ff4d4d;
            border: 1px solid rgba(255, 60, 60, 0.15);
        }

        .session-list { margin-bottom: 20px; }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .session-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .session-item .name { font-weight: 500; color: #ccc; font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; }

        .session-item .online {
            color: #00ff88;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .session-item .online::before {
            content: "";
            display: inline-block;
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 2s infinite;
        }

        .session-item .pending {
            color: #ffaa00;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .session-item .pending::before {
            content: "";
            display: inline-block;
            width: 6px; height: 6px;
            background: #ffaa00;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 8px #ffaa00;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            margin: 20px 0;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7b61ff, #5b3fff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(123, 97, 255, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #8b71ff, #6b4fff);
            box-shadow: 0 6px 25px rgba(123, 97, 255, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-sm {
            padding: 6px 14px;
            font-size: 11px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .btn-sm-danger {
            background: rgba(255, 60, 60, 0.12);
            color: #ff4d4d;
            border: 1px solid rgba(255, 60, 60, 0.2);
        }

        .btn-sm-danger:hover {
            background: rgba(255, 60, 60, 0.25);
            box-shadow: 0 0 12px rgba(255, 60, 60, 0.15);
        }

        .msg {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 12px;
            min-height: 20px;
            transition: color 0.2s ease;
        }

        #qrArea {
            text-align: center;
            margin-top: 16px;
        }

        #qrArea img {
            max-width: 200px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        #qrArea a {
            color: #7b61ff;
            font-size: 13px;
            word-break: break-all;
            text-decoration: none;
            transition: color 0.2s;
        }

        #qrArea a:hover { color: #9b81ff; }

        #qrArea p { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>YKD BOT 管理面板</h1>

        <div id="statusBar" class="status status-off">加载中...</div>

        <div id="sessionList" class="session-list"></div>

        <hr class="divider">

        <button class="btn btn-primary" onclick="doLogin()">扫码登录新账号</button>

        <div class="msg" id="msg"></div>
        <div id="qrArea"></div>
    </div>

    <script>
        const api = (path, opts) => fetch('/api/' + path, opts).then(r => r.json());

        function showMsg(text, isError) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.style.color = isError ? '#ff4d4d' : '#00ff88';
        }

        async function refreshStatus() {
            try {
                const s = await api('bot/status');
                const bar = document.getElementById('statusBar');
                const list = document.getElementById('sessionList');
                const online = s.botUsers || [];
                const pending = s.pendingUsers || [];

                let html = '';
                online.forEach(uid => {
                    html += '<div class="session-item">' +
                        '<span><span class="name">' + uid + '</span> <span class="online">● 在线</span></span>' +
                        '<button class="btn-sm btn-sm-danger" onclick="doDisconnect(\'' + uid + '\')">断开</button></div>';
                });
                pending.forEach(uid => {
                    html += '<div class="session-item">' +
                        '<span><span class="name">' + uid + '</span> <span class="pending">● 等待扫码</span></span>' +
                        '<button class="btn-sm btn-sm-danger" onclick="doDisconnect(\'' + uid + '\')">取消</button></div>';
                });
                list.innerHTML = html;

                const total = online.length + pending.length;
                if (total > 0) {
                    bar.className = 'status status-ok';
                    bar.textContent = '在线 ' + online.length + ' 个' + (pending.length > 0 ? '，等待扫码 ' + pending.length + ' 个' : '');
                } else {
                    bar.className = 'status status-off';
                    bar.textContent = '未连接';
                }
            } catch (e) { console.error(e); }
        }

        async function doLogin() {
            showMsg('正在登录...');
            document.getElementById('qrArea').innerHTML = '';
            try {
                const r = await api('bot/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
                if (r.success && r.qrUrl) {
                    showMsg('请扫描二维码登录');
                    document.getElementById('qrArea').innerHTML =
                        '<p style="font-size:12px;color:#555;margin-bottom:8px;">微信扫码</p>' +
                        '<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(r.qrUrl) + '" />' +
                        '<br><a href="' + r.qrUrl + '" target="_blank">链接直连</a>';
                } else if (r.success) {
                    showMsg(r.message || '登录成功');
                } else {
                    showMsg(r.message, true);
                }
                refreshStatus();
            } catch (e) { showMsg('登录请求失败: ' + e.message, true); }
        }

        async function doDisconnect(botUserId) {
            if (!confirm('确定断开 ' + botUserId + ' ？')) return;
            try {
                const r = await api('bot/disconnect?botUserId=' + encodeURIComponent(botUserId), { method: 'POST' });
                showMsg(r.message, !r.success);
                refreshStatus();
            } catch (e) { showMsg('断开失败: ' + e.message, true); }
        }

        refreshStatus();
        setInterval(refreshStatus, 5000);
    </script>
</body>
</html>
